<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart IT Asset Intelligence | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container glass-panel">
        <div class="login-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </div>
            <h1>Smart IT Asset Intelligence</h1>
            <p>Select your role to enter the platform (Demo)</p>
        </div>
        <div class="login-roles">
            <button class="btn btn-primary btn-block" onclick="login('ADMIN')">IT Administrator</button>
            <button class="btn btn-secondary btn-block" onclick="login('STAFF')">IT Staff</button>
        </div>
        <div class="login-footer">
            <p>Portfolio Project #3 - Asset Health & Lifecycle Engine</p>
        </div>
    </div>
    <script>
        function login(role) {
            localStorage.setItem('userRole', role);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
