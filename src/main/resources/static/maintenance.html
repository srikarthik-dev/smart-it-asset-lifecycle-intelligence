<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Smart IT Asset Intelligence</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header"><h2>AssetIntel</h2></div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li><a href="add-asset.html">Add Asset</a></li>
                <li><a href="employees.html">Employees</a></li>
                <li class="active"><a href="maintenance.html">Maintenance</a></li>
                <li><a href="transfers.html">Transfers</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="top-bar">
                <h1>Log Maintenance</h1>
            </header>
            <div class="glass-panel max-w-md">
                <form id="maintenanceForm">
                    <div class="form-group">
                        <label>Asset ID</label>
                        <input type="number" id="assetId" required placeholder="e.g. 1">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type">
                            <option value="PREVENTIVE">Preventive</option>
                            <option value="REPAIR">Repair</option>
                            <option value="HARDWARE_FAILURE">Hardware Failure</option>
                            <option value="SOFTWARE">Software Issue</option>
                            <option value="INSPECTION">Inspection</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="description" required>
                    </div>
                    <div class="form-group">
                        <label>Reported Date</label>
                        <input type="date" id="reportedDate" required>
                    </div>
                    <div class="form-group">
                        <label>Cost ($)</label>
                        <input type="number" step="0.01" id="cost" required>
                    </div>
                    <div class="form-group">
                        <label>Severity</label>
                        <select id="severity">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HIGH">High</option>
                            <option value="CRITICAL">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Technician</label>
                        <input type="text" id="technician" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="OPEN">Open</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Log Maintenance</button>
                    <div id="formMessage" style="margin-top: 15px;"></div>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/maintenance.js"></script>
</body>
</html>
